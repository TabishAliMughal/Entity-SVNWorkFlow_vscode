name: Package and publish

on:
  release:
    types: [published]
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  VSCE_VERSION: 4.1.1

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      vsix: ${{ steps.meta.outputs.vsix }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm test

      - name: Package .vsix
        run: npm run package

      - name: Locate .vsix
        id: meta
        run: |
          name="$(node -p "require('./package.json').name + '-' + require('./package.json').version")".vsix
          test -f "$name"
          echo "vsix=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: ${{ steps.meta.outputs.vsix }}
          if-no-files-found: error

      - name: Attach .vsix to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VSIX: ${{ steps.meta.outputs.vsix }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$VSIX" --clobber
          else
            echo "::notice::No GitHub release for $GITHUB_REF_NAME yet; .vsix is only in the workflow artifact."
          fi

  publish:
    needs: build
    if: vars.PUBLISH_MARKETPLACE == 'true' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: vsix

      # Default: Marketplace Trusted Publishing (policy on the publisher, no Entra app needed).
      - name: Publish (Marketplace trusted publishing)
        if: vars.PUBLISH_AUTH != 'entra'
        env:
          VSIX: ${{ needs.build.outputs.vsix }}
        run: npx --yes @vscode/vsce@${{ env.VSCE_VERSION }} publish --oidc --packagePath "$VSIX" --skip-duplicate

      # Alternative: Microsoft Entra workload identity federation. Set vars.PUBLISH_AUTH to 'entra'.
      - name: Azure login (workload identity federation)
        if: vars.PUBLISH_AUTH == 'entra'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: ${{ secrets.AZURE_SUBSCRIPTION_ID == '' }}

      - name: Publish (Entra ID)
        if: vars.PUBLISH_AUTH == 'entra'
        env:
          VSIX: ${{ needs.build.outputs.vsix }}
        run: npx --yes @vscode/vsce@${{ env.VSCE_VERSION }} publish --azure-credential --packagePath "$VSIX" --skip-duplicate
